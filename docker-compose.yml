services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: owing
      POSTGRES_USER: owing
      POSTGRES_PASSWORD: owing
    ports:
      - "5433:5432"
    volumes:
      - owing-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owing -d owing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  owing-pgdata:
