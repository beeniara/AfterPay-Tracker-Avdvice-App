services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Wake-on-LAN for the Ollama PC: the app only asks the "wol" sidecar below.
      PC_MAC_ADDRESS: ${PC_MAC_ADDRESS:-}
      WOL_SPOOL_DIR: /spool
      WAKE_ALLOWED_EMAILS: ${WAKE_ALLOWED_EMAILS:-}
      WAKE_WINDOW_SECONDS: ${WAKE_WINDOW_SECONDS:-180}
    ports:
      - "${APP_PORT:-127.0.0.1:8091}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    volumes:
      - ./public:/app/public:ro
      - wol_spool:/spool

  # Sends the Wake-on-LAN broadcast. Needs the host's network stack because a
  # bridge-network container can't broadcast onto the physical LAN. It opens no
  # port: the app talks to it through the wol_spool volume.
  wol:
    build:
      context: ./wol-sidecar
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      PC_MAC_ADDRESS: ${PC_MAC_ADDRESS:-}
      WOL_BROADCAST: ${WOL_BROADCAST:-192.168.1.255}
      WOL_SPOOL_DIR: /spool
    volumes:
      - wol_spool:/spool
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /spool/wol.heartbeat) )) -lt 10"]
      interval: 15s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-owing}
      POSTGRES_USER: ${DB_USER:-owing}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${FORWARD_DB_PORT:-127.0.0.1:5434}:5432"
    volumes:
      - owing-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-owing} -d ${DB_NAME:-owing}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  owing-pgdata:
  wol_spool:
